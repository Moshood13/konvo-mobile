name: CI + AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: corepack enable

      - uses: actions/cache@v3
        with:
          path: |
            .yarn/cache
            .yarn/unplugged
            .yarn/build-state.yml
          key: yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: yarn-

      - run: yarn install --immutable

      - run: yarn tsc --noEmit

      - run: yarn eslint . --ext .ts,.tsx

  ai-review:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Get changed files
        id: files
        run: |
          echo "changed=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E '\.(ts|tsx|js|jsx)$' | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: AI Code Review
        uses: villesau/ai-code-review-action@v2.7.0
        with:
          - name: AI Code Review
        uses: AleksandrFurmenkovOfficial/ai-code-review@v0.9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          ai_provider: openai
          openai_model: gpt-4

