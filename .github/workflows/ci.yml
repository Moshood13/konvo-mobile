name: Build

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
      profile:
        description: "EAS build profile"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  lint-typescript-prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup Corepack + Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate

      - name: Cache Yarn
        uses: actions/cache@v3
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify Expo configuration
        run: npx expo-doctor

      - name: Run TypeScript check
        run: yarn tsc --noEmit

      - name: Run ESLint
        run: yarn eslint . --ext .ts,.tsx

      - name: Run Prettier
        run: yarn prettier --check .

  eas-build:
    runs-on: ubuntu-latest
    needs: lint-typescript-prettier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup Corepack + Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate

      - name: Cache Yarn
        uses: actions/cache@v3
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Determine build profile
        id: profile
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "profile=production" >> $GITHUB_OUTPUT
          else
            echo "profile=development" >> $GITHUB_OUTPUT
          fi

      - name: Run EAS build
        run: yarn dlx eas-cli@latest build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
